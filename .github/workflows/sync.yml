name: mirror-sync

# 红果上游镜像自动同步:每 6 小时跑一次,也可在 Actions 页手动触发。
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时(UTC 0/6/12/18 点)
  workflow_dispatch:         # 手动触发按钮

# 允许工作流提交源码快照、创建 Releases
permissions:
  contents: write

# 同一时间只跑一个,避免并发推送/发布打架
concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # 需要完整历史以便提交源码快照 / 计算 keepalive 间隔
          # 可选:若配置了 secrets.KEEPALIVE_PAT(fine-grained PAT, contents:write),
          # 则用它推送,使提交以本人身份算作仓库活动,100% 保活;
          # 未配置则回退到内置 GITHUB_TOKEN(通常也够用)。
          token: ${{ secrets.KEEPALIVE_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Ensure tools (jq / rsync)
        run: |
          jq --version   >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y jq)
          rsync --version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y rsync)

      - name: Run sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh CLI 用它建 release/读上游
          MIRROR_REPO: ${{ github.repository }}
          KEEPALIVE_DAYS: '50'
        run: bash sync.sh
